<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Cat Status</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>HTTP Cat Status</h1>
        <p>Digite um código HTTP (exemplo: 404)</p>
        <input type="number" id="statusInput">
        <button id="buscarButton">Buscar</button>
        <div id="resultado">
            <p>
                <h3>Status: 404</h3>
                <img src="https://http.cat/404" alt="Gato 404">
            </p>
        </div>
    </div>
    <script src="src/js/script.js"></script>
</body>
</html>
